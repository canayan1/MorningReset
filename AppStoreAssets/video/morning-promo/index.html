<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F4F6FC;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-the-melody"
        class="scene"
        data-composition-id="01-the-melody"
        data-composition-src="compositions/frames/01-the-melody.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-one-thing"
        class="scene"
        data-composition-id="02-one-thing"
        data-composition-src="compositions/frames/02-one-thing.html"
        data-start="4.5"
        data-duration="5.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-one-thing-voice"
        src="assets/voice/02.wav"
        data-start="4.5"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-the-smile"
        class="scene"
        data-composition-id="03-the-smile"
        data-composition-src="compositions/frames/03-the-smile.html"
        data-start="9.5"
        data-duration="5.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-the-smile-voice"
        src="assets/voice/03.wav"
        data-start="9.5"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-the-offer"
        class="scene"
        data-composition-id="04-the-offer"
        data-composition-src="compositions/frames/04-the-offer.html"
        data-start="14.5"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-the-offer-voice"
        src="assets/voice/04.wav"
        data-start="14.5"
        data-duration="5.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-breath-pulse-mornings"
        class="scene"
        data-composition-id="05-breath-pulse-mornings"
        data-composition-src="compositions/frames/05-breath-pulse-mornings.html"
        data-start="20"
        data-duration="6"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-breath-pulse-mornings-voice"
        src="assets/voice/05.wav"
        data-start="20"
        data-duration="5.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-inner-light"
        class="scene"
        data-composition-id="06-inner-light"
        data-composition-src="compositions/frames/06-inner-light.html"
        data-start="25.5"
        data-duration="3.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-inner-light-voice"
        src="assets/voice/06.wav"
        data-start="25.5"
        data-duration="3.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- The alarm itself: the app's real melody, running from the first
           frame and drawing away across Frame 3 as "the bell lets go" lands.
           The duck under the first voice line and the final fade are baked
           into the file rather than automated here, so the render reproduces
           them exactly. -->
      <audio
        id="el-alarm-bed"
        src="assets/audio/alarm-bed.m4a"
        data-start="0"
        data-duration="12.6"
        data-track-index="12"
        data-volume="0.85"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.loop.mp3"
        data-start="0"
        data-duration="29"
        data-track-index="11"
        data-volume="0.12"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-the-melody", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.fromTo("#el-02-one-thing", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.to("#el-02-one-thing", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.fromTo("#el-03-the-smile", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.to("#el-03-the-smile", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14.5);
        tl.fromTo("#el-04-the-offer", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14.5);
        tl.to("#el-04-the-offer", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.fromTo("#el-05-breath-pulse-mornings", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.to("#el-05-breath-pulse-mornings", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.fromTo("#el-06-inner-light", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25.5);
        tl.to({}, { duration: 29 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
